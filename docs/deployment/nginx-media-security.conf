# Include inside the HTTPS server block. Dynamic submission materials should be
# downloaded through Django's authorized download endpoint, not this location.
location ^~ /media/avatars/ {
    alias /path/to/CManager/media/avatars/;
    autoindex off;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "default-src 'none'; img-src 'self'; sandbox" always;
}

location /media/ {
    alias /path/to/CManager/media/;
    autoindex off;
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "default-src 'none'; img-src 'self'; sandbox" always;

    # Never execute or serve uploaded script-like content.
    location ~* \.(php|cgi|pl|py|sh|html?|svg|js|mjs)$ {
        deny all;
    }
}
