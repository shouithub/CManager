# Include inside the HTTPS server block. Dynamic submission materials should be
# downloaded through Django's authorized download endpoint, not this location.
location ^~ /media/avatars/ {
    alias /path/to/CManager/media/avatars/;
    autoindex off;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "default-src 'none'; img-src 'self'; sandbox" always;
}

location ^~ /media/site/ {
    alias /path/to/CManager/media/site/;
    autoindex off;
    add_header Cache-Control "public, max-age=2592000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "default-src 'none'; img-src 'self'; sandbox" always;
}

location ^~ /media/carousel/ {
    alias /path/to/CManager/media/carousel/;
    autoindex off;
    add_header Cache-Control "public, max-age=2592000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "default-src 'none'; img-src 'self'; sandbox" always;
}

# All business files use /media-access/<signed-token>/ through Django. Never
# expose blobs/, form submissions, templates, or announcement uploads directly.
location /media/ {
    return 404;
}
