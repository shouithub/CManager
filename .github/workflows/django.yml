name: Django CI

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DEBUG: "False"
      CREDENTIAL_ENCRYPTION_KEY: "MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA="
      ALLOW_NON_REDIS_CACHE: "True"
      SESSION_COOKIE_SECURE: "True"
      CSRF_COOKIE_SECURE: "True"
      DB_ENGINE: ${{ matrix.db_engine }}
      DB_NAME: ${{ matrix.db_name }}
      DB_USER: ${{ matrix.db_user }}
      DB_PASSWORD: ${{ matrix.db_password }}
      DB_HOST: ${{ matrix.db_host }}
      DB_PORT: ${{ matrix.db_port }}
      ALLOWED_HOSTS: "localhost,127.0.0.1"
      CSRF_TRUSTED_ORIGINS: "https://localhost,https://127.0.0.1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.12"
            database: sqlite
            db_engine: django.db.backends.sqlite3
            db_name: ci.sqlite3
            db_user: ""
            db_password: ""
            db_host: ""
            db_port: ""
          - python-version: "3.12"
            database: mysql
            db_engine: django.db.backends.mysql
            db_name: cmanager
            db_user: root
            db_password: root
            db_host: 127.0.0.1
            db_port: "3306"
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: cmanager
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Generate ephemeral CI secret
        run: echo "SECRET_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(64))')" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.txt
      - name: Static checks
        run: |
          ruff check --exclude clubs/migrations --select E9,F63,F7,F82,F811 clubs CManager scripts
          pyright --pythonpath "$(command -v python)"
          python -m compileall -q clubs CManager scripts
          python manage.py makemigrations --check --dry-run
          python manage.py check
      - name: Dependency audit
        run: pip-audit -r requirements.txt
      - name: Migrate
        run: python manage.py migrate
      - name: Test
        run: python manage.py test
      - name: Deployment checks
        run: python manage.py check --deploy
      - name: Collect static
        run: python manage.py collectstatic --noinput

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout release notes
        uses: actions/checkout@v7
      - name: Create tagged release
        uses: softprops/action-gh-release@v3
        with:
          body_path: RELEASE_NOTES.md
