{% extends base_template %}

{% block title %}切换到社长身份{% endblock %}

{% block extra_css %}
<style>
    .identity-prompt {
        max-width: 860px;
        margin: 0 auto;
        padding: 28px 24px calc(48px + 90px);
    }

    .identity-card {
        border: 1px solid var(--md3-outline-variant);
        border-radius: var(--md3-radius-xl);
        background: var(--md3-surface-container-low);
        padding: 28px;
        display: grid;
        gap: 18px;
    }

    .identity-card p {
        margin: 0;
        color: var(--md3-on-surface-variant);
        line-height: 1.7;
    }

    .identity-actions {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
    }

    .identity-actions form {
        margin: 0;
    }
</style>
{% endblock %}

{% block content %}
<div class="identity-prompt">
    <section class="page-header">
        <span class="material-icons">switch_account</span>
        <div class="page-header-content">
            <h1>切换到社长身份</h1>
            <p class="subtitle">当前账号还有 {{ president_club_count }} 个社团的现任社长身份</p>
        </div>
        <a href="{% url 'clubs:index' %}" class="page-back-btn" title="返回首页" aria-label="返回首页">
            <span class="material-icons">arrow_back</span>
        </a>
    </section>

    <section class="identity-card">
        <p>您当前正在使用主身份。进入“我的社团”、社员管理、审批记录和提交通道前，需要先切换到社长身份。</p>
        <div class="identity-actions">
            <form method="post" action="{% url 'clubs:switch_identity' %}">
                {% csrf_token %}
                <input type="hidden" name="identity" value="president">
                <input type="hidden" name="next" value="{% url 'clubs:user_dashboard' %}">
                <button type="submit" class="btn btn-primary">
                    <span class="material-icons">login</span>
                    切换到社长身份
                </button>
            </form>
        </div>
    </section>
</div>
{% endblock %}
